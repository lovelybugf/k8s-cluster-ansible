---
- name: Cap nhat he dieu hanh va khoi dong lai Node an toan
  hosts: all
  become: true
  serial: 1 # Chay lan luot tung Node mot de tranh lam sup ca cum K8s
  tasks:
    - name: Cap nhat danh sach package (Apt)
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes
      when: ansible_os_family == "Debian"

    - name: Kiem tra xem he thong co yeu cau khoi dong lai khong (Ubuntu/Debian)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Thuc hien reboot neu co yeu cau
      ansible.builtin.reboot:
        msg: "Ansible triggered reboot after system updates"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: uptime
      when: reboot_required_file.stat.exists
...
